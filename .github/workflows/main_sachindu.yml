# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - sachindu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./pos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: pos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm run test --if-present

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            ./pos
            !./pos/.next/cache
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deploy-package

      - name: Verify deployment files
        run: |
          echo "Deployment package contents:"
          ls -la ./deploy-package

          if [ ! -f "./deploy-package/package.json" ]; then
            echo "Error: package.json was not found in deployment package"
            exit 1
          fi

          if [ ! -d "./deploy-package/.next" ]; then
            echo "Error: .next build folder was not found"
            exit 1
          fi

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sachindu'
          slot-name: 'Production'
          package: ./deploy-package
        
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CD1F985F5C5C42E18DD56BD8C195C13B }}
